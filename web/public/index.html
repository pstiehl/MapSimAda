<!DOCTYPE html>
<meta charset="utf-8"><title>MapSimAda — Val d'Orcia v0</title>
<style>
 html,body{margin:0;height:100%;background:#0d1014;overflow:hidden;
   font:13px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;color:#e8e6e1}
 canvas{display:block}
 #hud{position:fixed;top:14px;left:14px;background:rgba(10,12,16,.76);
   padding:12px 15px;border-radius:9px;backdrop-filter:blur(9px);
   border:1px solid rgba(255,255,255,.1);max-width:310px}
 #hud b{color:#ecc448;font-weight:600} kbd{background:#2b2f37;border-radius:4px;
   padding:1px 6px;font:11px ui-monospace,monospace;border:1px solid #3d424c}
 #attr{position:fixed;bottom:0;left:0;right:0;background:rgba(8,10,13,.82);
   padding:7px 14px;font-size:10.5px;color:#9aa0aa;line-height:1.45}
 #boot{position:fixed;inset:0;display:grid;place-items:center;background:#0d1014;
   font-size:15px;color:#b8bcc4;z-index:9}
 #mode{color:#7fd1a8;font-weight:600}
</style>
<div id="boot">loading Val d'Orcia…</div>
<div id="hud" hidden>
  <div style="font-size:15px;font-weight:600;margin-bottom:5px">Val d'Orcia <b>v0</b></div>
  <div>Mode: <span id="mode">walking</span></div>
  <div id="pos" style="color:#9aa0aa;font-size:11.5px;margin:4px 0 9px"></div>
  <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; <kbd>shift</kbd> run</div>
  <div style="margin-top:3px"><kbd>T</kbd> board / leave the train</div>
  <div style="margin-top:3px"><kbd>click</kbd> look around &nbsp; <kbd>esc</kbd> release</div>
</div>
<div id="attr"></div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const M = await (await fetch('./slice.json')).json();
const raw = new Uint16Array(await (await fetch('./terrain.bin')).arrayBuffer());
const {width:W, height:H, pxSize:P, zMin, zMax} = M;
const zAt = (c,r)=> zMin + (raw[Math.min(Math.max(r,0),H-1)*W + Math.min(Math.max(c,0),W-1)]/65535)*(zMax-zMin);
const ground = (x,y)=>{                       // bilinear sample, metres
  const fc=x/P, fr=y/P, c=Math.floor(fc), r=Math.floor(fr), tc=fc-c, tr=fr-r;
  return (zAt(c,r)*(1-tc)+zAt(c+1,r)*tc)*(1-tr) + (zAt(c,r+1)*(1-tc)+zAt(c+1,r+1)*tc)*tr;
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9db4c8);
scene.fog = new THREE.Fog(0x9db4c8, 2600, 11000);
const cam = new THREE.PerspectiveCamera(66, innerWidth/innerHeight, 0.5, 26000);
const rend = new THREE.WebGLRenderer({antialias:true});
rend.setSize(innerWidth, innerHeight);
rend.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(rend.domElement);

scene.add(new THREE.HemisphereLight(0xcfe0f0, 0x4a4436, 1.25));
const sun = new THREE.DirectionalLight(0xffeccc, 1.5);
sun.position.set(-1,1.15,0.55).multiplyScalar(4000); scene.add(sun);

// ---- terrain ----
const geo = new THREE.PlaneGeometry(M.spanX, M.spanY, W-1, H-1);
geo.rotateX(-Math.PI/2);
const pos = geo.attributes.position, col = new Float32Array(pos.count*3);
const cLow=new THREE.Color(0x6f8348), cMid=new THREE.Color(0x9a9c62), cHi=new THREE.Color(0xc4b393);
for (let i=0;i<pos.count;i++){
  const r = Math.floor(i/W), c = i%W, h = zAt(c,r);
  pos.setY(i,h);
  const t=(h-zMin)/(zMax-zMin);
  const col3 = t<0.5 ? cLow.clone().lerp(cMid,t*2) : cMid.clone().lerp(cHi,(t-0.5)*2);
  col3.toArray(col,i*3);
}
geo.setAttribute('color', new THREE.BufferAttribute(col,3));
geo.computeVertexNormals();
const terrain = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({vertexColors:true}));
terrain.position.set(M.spanX/2, 0, M.spanY/2);      // world origin at raster corner
scene.add(terrain);

// ---- rail ----
const rp = M.railPath.map(p=>new THREE.Vector3(p.x, p.z+0.9, p.y));
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(rp),
                         new THREE.LineBasicMaterial({color:0x3a3a40})));
const curve = new THREE.CatmullRomCurve3(rp);
const railLen = curve.getLength();

// ---- controls ----
let walking = true, s = 0.34, yaw = -0.6, pitch = -0.04;
const player = new THREE.Vector3(M.spawn.x, 0, M.spawn.y);
const keys = {};
addEventListener('keydown', e=>{
  keys[e.code]=true;
  if (e.code==='KeyT'){ walking=!walking; mode.textContent = walking?'walking':'aboard the train'; }
});
addEventListener('keyup', e=>keys[e.code]=false);
rend.domElement.onclick = ()=>rend.domElement.requestPointerLock();
addEventListener('mousemove', e=>{
  if (document.pointerLockElement!==rend.domElement) return;
  yaw -= e.movementX*0.0022;
  pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY*0.0022));
});
addEventListener('resize', ()=>{
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  rend.setSize(innerWidth,innerHeight);
});

const EYE = 1.7, clk = new THREE.Clock();
function frame(){
  const dt = Math.min(clk.getDelta(), 0.1);
  if (walking){
    const v = (keys.ShiftLeft||keys.ShiftRight ? 14 : 4.2) * dt;
    const f = (keys.KeyW?1:0)-(keys.KeyS?1:0), st = (keys.KeyD?1:0)-(keys.KeyA?1:0);
    player.x += (Math.sin(yaw)*-f + Math.cos(yaw)*st) * v;
    player.z += (Math.cos(yaw)*-f - Math.sin(yaw)*st) * v;
    player.x = Math.max(1, Math.min(M.spanX-1, player.x));
    player.z = Math.max(1, Math.min(M.spanY-1, player.z));
    cam.position.set(player.x, ground(player.x, player.z)+EYE, player.z);
    cam.rotation.set(pitch, yaw, 0, 'YXZ');
    pos_.textContent = `${(player.x/1000).toFixed(2)} km E · ${(player.z/1000).toFixed(2)} km S · ${ground(player.x,player.z).toFixed(0)} m`;
  } else {
    s += (17*dt)/railLen; if (s>1) s -= 1;              // ~61 km/h
    const p = curve.getPointAt(s), look = curve.getPointAt(Math.min(s+0.004,1));
    cam.position.set(p.x, p.y+2.6, p.z);
    cam.lookAt(look.x, look.y+2.6, look.z);
    player.set(p.x, 0, p.z);
    pos_.textContent = `Asciano–Monte Antico · ${(s*railLen/1000).toFixed(2)} / ${(railLen/1000).toFixed(2)} km`;
  }
  rend.render(scene, cam);
  requestAnimationFrame(frame);
}
const mode = document.getElementById('mode'), pos_ = document.getElementById('pos');
document.getElementById('attr').textContent = M.attribution.join('  ·  ');
document.getElementById('boot').remove();
document.getElementById('hud').hidden = false;
frame();
</script>
